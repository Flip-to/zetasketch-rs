name: Fuzz (nightly)

# Longer fuzzing than the 60 s CI smoke test, with the corpus kept between runs so coverage
# accumulates. Crashes are uploaded as artifacts.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "900"

permissions:
  contents: read

concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [decode, differential_fold]
    env:
      SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '900' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly + cargo-fuzz
        run: rustup toolchain install nightly --profile minimal && cargo install cargo-fuzz --locked
      - name: Restore corpus
        uses: actions/cache/restore@v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Run
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${SECONDS_PER_TARGET}
      - name: Minimize corpus
        if: always()
        working-directory: fuzz
        run: cargo +nightly fuzz cmin ${{ matrix.target }} || true
      - name: Save corpus
        if: always()
        uses: actions/cache/save@v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
