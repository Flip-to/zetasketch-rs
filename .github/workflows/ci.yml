name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        toolchain: [stable, "1.75"]
        include:
          - os: windows-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        shell: bash
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup default ${{ matrix.toolchain }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
      - name: Golden corpus + BigQuery parity
        run: cargo test --release

  fuzz-smoke:
    name: Fuzz smoke (60s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install nightly + cargo-fuzz
        run: rustup toolchain install nightly --profile minimal && cargo install cargo-fuzz --locked
      - name: Run targets
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run decode -- -max_total_time=60
          cargo +nightly fuzz run differential_fold -- -max_total_time=60

  lint:
    name: Lint & docs layout guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-lint-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Docs build without warnings
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Package (what crates.io would receive)
        run: cargo package --locked
      - name: Bias tables match Java ZetaSketch Data.java (pinned commit)
        run: |
          git init -q /tmp/zetasketch
          git -C /tmp/zetasketch fetch -q --depth 1 https://github.com/google/zetasketch.git d098c49efb5a5bc70eec89c028a38b14b930ca98
          git -C /tmp/zetasketch checkout -q FETCH_HEAD
          python3 scripts/gen_bias_data.py /tmp/zetasketch/java/com/google/zetasketch/internal/hllplus/Data.java
          rustfmt --edition 2021 src/bias_data.rs
          git diff --exit-code -- src/bias_data.rs
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync Python tooling (uv.lock)
        run: uv sync --locked
      - name: Guard docs layout (specs, decisions, tech_debt, beans, A2V)
        run: uv run python scripts/check_docs_layout.py
      - name: Ruff (scripts/, tests/python/)
        run: |
          uv run ruff check scripts tests/python
          uv run ruff format --check scripts tests/python
      - name: Pytest (Python tooling)
        run: uv run pytest
      - name: Real-data validation checker (self-check + committed BigQuery merge fixtures)
        run: |
          cargo run --release --quiet --example validate_groups -- --self-check
          python3 scripts/fixtures_to_group_tsv.py /tmp/groups
          cargo run --release --quiet --example validate_groups -- /tmp/groups/rows.tsv /tmp/groups/expected.tsv
          cargo run --release --quiet --example validate_groups -- /tmp/groups/rows.tsv /tmp/groups/expected.tsv --trusted

  semver:
    name: SemVer check against crates.io
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain + cargo-semver-checks
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          cargo install cargo-semver-checks --locked
      - name: Public API changes are allowed by the version in Cargo.toml
        # Compares against the latest published version on crates.io.
        run: cargo semver-checks check-release

  java-oracle:
    name: Java ZetaSketch oracle (differential)
    runs-on: ubuntu-24.04
    env:
      ZETASKETCH_COMMIT: d098c49efb5a5bc70eec89c028a38b14b930ca98
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-zetasketch-${{ env.ZETASKETCH_COMMIT }}
      - name: Build Java ZetaSketch at the pinned commit
        run: |
          git init -q /tmp/zetasketch
          git -C /tmp/zetasketch fetch -q --depth 1 https://github.com/google/zetasketch.git "$ZETASKETCH_COMMIT"
          git -C /tmp/zetasketch checkout -q FETCH_HEAD
          # Throwaway clone: add a task that prints the full runtime classpath (compiled classes
          # plus every dependency jar). The shaded jar does not bundle all runtime dependencies.
          cat >> /tmp/zetasketch/build.gradle <<'GRADLE'
          tasks.register('printRuntimeClasspath') {
              dependsOn classes
              doLast { println sourceSets.main.runtimeClasspath.asPath }
          }
          GRADLE
          cd /tmp/zetasketch && JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew -q --no-daemon printRuntimeClasspath > /tmp/classpath.txt
          tail -c 300 /tmp/classpath.txt
      - name: Compile the oracle
        run: |
          JAR=$(tail -n1 /tmp/classpath.txt)
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/javac" -cp "$JAR" -d /tmp/oracle oracle/Oracle.java
      - name: Random scenarios through both implementations
        run: |
          cargo build --release --quiet --example oracle_driver
          for seed in 11 22 33; do
            ./target/release/examples/oracle_driver "$seed" 150 "/tmp/ops_$seed.txt" "/tmp/rust_$seed.txt"
            "$JAVA_HOME_17_X64/bin/java" -cp "$JAR:/tmp/oracle" Oracle < "/tmp/ops_$seed.txt" > "/tmp/java_$seed.txt"
            lines=$(wc -l < "/tmp/rust_$seed.txt")
            if diff -q "/tmp/rust_$seed.txt" "/tmp/java_$seed.txt" > /dev/null; then
              echo "seed $seed: $lines emitted sketches identical (bytes and estimate)"
            else
              echo "::error::seed $seed: Rust and Java ZetaSketch differ"
              diff "/tmp/rust_$seed.txt" "/tmp/java_$seed.txt" | cut -c1-200 | head -20
              grep -m3 '^EXC' "/tmp/java_$seed.txt" || true
              exit 1
            fi
          done

  coverage:
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain + llvm-tools + cargo-llvm-cov
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview && rustup default stable
          cargo install cargo-llvm-cov --locked
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-coverage-${{ hashFiles('Cargo.lock') }}
      - name: Line and region coverage of src/ (all test suites)
        run: |
          cargo llvm-cov --release --lcov --output-path lcov.info
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --release --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
