name: Release (crates.io & GitHub Release)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  id-token: write # crates.io trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, publish, release
    runs-on: ubuntu-24.04
    # Trusted publisher on crates.io is bound to this workflow + environment.
    environment: crates-io
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      - name: Tag matches Cargo.toml version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version ${VERSION}"
            exit 1
          fi

      - name: Lint and parity suites
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --release

      - name: Package
        # Leaves target/package/<name>-<version>.crate for the GitHub Release asset.
        run: cargo package --locked

      - name: Already on crates.io?
        id: published
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"])')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -A "${GITHUB_REPOSITORY} release" \
            "https://crates.io/api/v1/crates/${NAME}/${TAG#v}")
          echo "exists=$([ "$CODE" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Exchange the GitHub OIDC token for a short-lived crates.io token (trusted publishing).
      # Runs even when the version already exists, so a re-run checks the setup end to end.
      # Plain curl instead of rust-lang/crates-io-auth-action (org action allow-list).
      - name: crates.io token (trusted publishing)
        id: auth
        run: |
          OIDC=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          RESP=$(curl -sS -w '\n%{http_code}' -X POST https://crates.io/api/v1/trusted_publishing/tokens \
            -H 'Content-Type: application/json' -A "${GITHUB_REPOSITORY} release" \
            -d "{\"jwt\": \"${OIDC}\"}")
          CODE=$(echo "$RESP" | tail -n1)
          if [ "$CODE" = 200 ]; then
            TOKEN=$(echo "$RESP" | head -n -1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
            echo "::add-mask::${TOKEN}"
            echo "CARGO_REGISTRY_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
            echo "method=trusted" >> "$GITHUB_OUTPUT"
            echo "Trusted publishing token issued."
          else
            echo "::error::crates.io trusted publishing exchange failed (HTTP ${CODE}). Check the trusted publisher (Flip-to/zetasketch-rs, release.yml, environment crates-io)."
            exit 1
          fi

      - name: Publish to crates.io
        if: steps.published.outputs.exists != 'true'
        run: cargo publish --locked --no-verify

      - name: Revoke trusted publishing token
        if: always() && steps.auth.outputs.method == 'trusted'
        run: |
          curl -sS -o /dev/null -w 'revoke HTTP %{http_code}\n' -X DELETE \
            https://crates.io/api/v1/trusted_publishing/tokens \
            -H "Authorization: Bearer ${CARGO_REGISTRY_TOKEN}" -A "${GITHUB_REPOSITORY} release"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" target/package/*.crate --clobber
          else
            gh release create "${TAG}" target/package/*.crate \
              --title "${TAG}" --generate-notes --verify-tag
          fi
